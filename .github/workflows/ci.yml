name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Verilator lint
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build devcontainer and lint RTL
        uses: devcontainers/ci@v0.3
        with:
          runCmd: make -C utils ci