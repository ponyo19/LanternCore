name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build devcontainer and run CI checks
        uses: devcontainers/ci@v0.3
        with:
          runCmd: make -C utils ci